    <script>
      // GitHub Pages SPA fallback: restore the intended route from 404.html redirect.
      // Guard against offline SW-cached loads: only restore if a real 404 redirect occurred.
      (function () {
        var redirect = sessionStorage.redirect;
        var redirectAt = Number(sessionStorage.redirectAt || 0);
        var isFreshRedirect = redirectAt > 0 && Date.now() - redirectAt < 10000;
        if (redirect && isFreshRedirect && navigator.onLine) {
          delete sessionStorage.redirect;
          delete sessionStorage.redirectAt;
          var url = redirect.replace(location.origin, '');
          if (url && url !== location.pathname) {
            history.replaceState(null, '', url);
          }
        } else if (redirectAt && Date.now() - redirectAt >= 10000) {
          delete sessionStorage.redirect;
          delete sessionStorage.redirectAt;
        }
      })();
    </script>
